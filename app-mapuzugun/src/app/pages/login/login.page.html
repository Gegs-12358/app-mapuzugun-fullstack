<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center" style="font-weight: 800;">Kimanke</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="map-background">

  <div class="login-wrapper">

    <div class="textile-band"></div>

    <div class="login-hero">
      <div class="login-logo" style="background-image: url('assets/img/logo.png')"></div>
      <h1 class="login-greeting">Mari mari</h1>
      <p class="login-tagline">Aprende y practica mapuzugun, un paso a la vez.</p>
    </div>

    <ion-card class="login-card">

      <ion-card-header>
        <ion-card-title>Ingresa a tu cuenta</ion-card-title>
        <ion-card-subtitle>Continúa donde lo dejaste</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form (ngSubmit)="onSubmit()">

          <ion-item lines="none" class="campo">
            <ion-input
              name="username"
              label="Usuario"
              labelPlacement="floating"
              autocomplete="username"
              [(ngModel)]="username">
            </ion-input>
          </ion-item>

          <ion-item lines="none" class="campo">
            <ion-input
              name="password"
              label="Contraseña"
              labelPlacement="floating"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password"
              [(ngModel)]="password">
            </ion-input>
            <button slot="end" type="button" class="toggle-pass" (click)="showPassword = !showPassword">
              {{ showPassword ? 'Ocultar' : 'Mostrar' }}
            </button>
          </ion-item>

          <div class="login-error" role="alert" *ngIf="errorMsg">{{ errorMsg }}</div>

          <ion-button expand="block" type="submit" class="btn-principal" [disabled]="loading">
            <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
            <span *ngIf="!loading">INICIAR SESIÓN</span>
          </ion-button>

        </form>

        <div class="ion-text-center">
          <ion-button fill="clear" class="btn-cambio" routerLink="/register">
            ¿No tienes cuenta? Crea una
          </ion-button>
        </div>
      </ion-card-content>

    </ion-card>

    <p class="login-footer">
      Proyecto gratuito para practicar la lengua.<br>
      Contenido de prueba: aún en revisión con hablantes.
      <a routerLink="/acerca" style="color: #1F3A60; font-weight: 700; text-decoration: underline;">Acerca de Kimanke</a>
    </p>
    

  </div>

</ion-content>
