<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">Unidades</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="background-color: #F5EBE1;">
  
  <div *ngIf="loading" class="ion-text-center ion-margin-top" style="color: #1F3A60; font-weight: bold;">
    Cargando unidades...
  </div>

  <ion-list *ngIf="!loading" lines="none">
    <ion-item 
      *ngFor="let unidad of unidades" 
      (click)="irAUnidad(unidad.id)"
      class="unidad-card ion-margin-bottom"
      button>
      
      <ion-icon name="book-outline" slot="start" class="icono-unidad"></ion-icon>
      
      <ion-label>
        <h2 class="titulo-unidad">Unidad {{ unidad.id }}</h2>
        <p class="subtitulo-unidad">{{ unidad.title }}</p>
      </ion-label>

      <ion-icon name="chevron-forward-outline" slot="end" class="flecha-unidad"></ion-icon>
    </ion-item>
  </ion-list>

</ion-content>
