<ion-header class="ion-no-border" style="box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10;">
  <ion-toolbar color="primary">
    <ion-title style="font-weight: 800; letter-spacing: 1px;">Küme Rüpü</ion-title>
    
    <ion-buttons slot="start">
      <ion-button>
        <span style="font-size: 13px; font-weight: bold; color: white;">Hola, {{ username }}</span>
      </ion-button>
    </ion-buttons>

    <ion-buttons slot="end">
      <ion-button (click)="cerrarSesion()">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding map-content">
  
  <div *ngIf="loading" class="ion-text-center ion-margin-top" style="color: #1F3A60; font-weight: bold;">
    Cargando el camino...
  </div>

  <!-- CONTADOR DE PROGRESO -->
  <div *ngIf="!loading" class="progress-summary">
    <p>Has completado <strong>{{ completadas }}</strong> de <strong>{{ totalUnidades }}</strong> unidades</p>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" [style.width.%]="(completadas / totalUnidades) * 100"></div>
    </div>
  </div>

  <div class="path-container" *ngIf="!loading">
    <div 
      *ngFor="let unidad of unidades; let i = index" 
      class="path-node-container"
      [ngClass]="{'left-align': i % 2 !== 0, 'right-align': i % 2 === 0}">
      
      <div class="path-line" *ngIf="i !== 0"></div>
      
      <!-- Estrella con estado dinámico -->
      <div class="path-node" 
           [ngClass]="[
             'color-unit-' + ((i % 5) + 1),
             'state-' + estadoUnidad(unidad.id)
           ]"
           (click)="irAUnidad(unidad.id)">
        <div class="star-shape"></div>
        
        <!-- Número (si no está completada) -->
        <span class="node-number" *ngIf="!estaCompletada(unidad.id)">{{ unidad.id }}</span>
        
        <!-- Checkmark (si está completada) -->
        <ion-icon *ngIf="estaCompletada(unidad.id)" name="checkmark" class="node-icon-check"></ion-icon>
        
        <!-- Candado (si está bloqueada) -->
        <ion-icon *ngIf="!estaDesbloqueada(unidad.id)" name="lock-closed" class="node-icon-lock"></ion-icon>
      </div>
      
      <p class="node-title">{{ unidad.title }}</p>
    </div>
  </div>

</ion-content>
